[project]
name = "toturial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kope", email = "keshavpsdneupane@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torchvision>=0.28.0",
]

[project.scripts]
toturial = "toturial:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
